spring:
  application:
    name: ramals-learning-platform
  datasource:
    url: ${RAMALS_DB_URL}
    username: ${RAMALS_DB_USER}
    password: ${RAMALS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${RAMALS_DB_URL}
    user: ${RAMALS_DB_MIGRATION_USER:ramals_core_migration}
    password: ${RAMALS_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: core
    schemas: core,ledger,audit
    create-schemas: true
    validate-migration-naming: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RAMALS_OIDC_ISSUER_URI:http://localhost:8081/realms/ramals}
          audiences: ${RAMALS_OIDC_AUDIENCE:ramals-api}

ramals:
  security:
    web-origin: ${RAMALS_WEB_ORIGIN:http://localhost:5173}
    rate-limit:
      enabled: ${RAMALS_RATE_LIMIT_ENABLED:true}
      capacity: ${RAMALS_RATE_LIMIT_CAPACITY:120}
      refill-per-second: ${RAMALS_RATE_LIMIT_REFILL_PER_SECOND:60}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Full sampling by default for MVP-0 so every failure is traceable; lower in production
    # via RAMALS_TRACE_SAMPLE. Trace/span ids are safe identifiers; no tokens, credentials, or
    # learner free text are ever placed on spans or in structured logs.
    sampling:
      probability: ${RAMALS_TRACE_SAMPLE:1.0}
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
