spring:
  application:
    name: ramals-learning-platform
  datasource:
    url: ${RAMALS_DB_URL}
    username: ${RAMALS_DB_USER}
    password: ${RAMALS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${RAMALS_DB_URL}
    user: ${RAMALS_DB_MIGRATION_USER:ramals_core_migration}
    password: ${RAMALS_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: core
    schemas: core,ledger,audit
    create-schemas: true
    validate-migration-naming: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RAMALS_OIDC_ISSUER_URI:http://localhost:8081/realms/ramals}
          audiences: ${RAMALS_OIDC_AUDIENCE:ramals-api}

ramals:
  ai:
    base-url: ${RAMALS_AI_BASE_URL:}
    workload-token-url: ${RAMALS_AI_WORKLOAD_TOKEN_URL:}
    workload-client-id: ${RAMALS_AI_WORKLOAD_CLIENT_ID:}
    workload-client-secret: ${RAMALS_AI_WORKLOAD_CLIENT_SECRET:}
    workload-audience: ${RAMALS_AI_WORKLOAD_AUDIENCE:ramals-ai}
    dispatcher:
      enabled: ${RAMALS_AI_DISPATCHER_ENABLED:true}
      poll-interval-ms: ${RAMALS_AI_DISPATCHER_POLL_INTERVAL_MS:1000}
      batch-size: ${RAMALS_AI_DISPATCHER_BATCH_SIZE:4}
      lease-millis: ${RAMALS_AI_DISPATCHER_LEASE_MS:60000}
      max-attempts: ${RAMALS_AI_DISPATCHER_MAX_ATTEMPTS:5}
      initial-backoff-millis: ${RAMALS_AI_DISPATCHER_INITIAL_BACKOFF_MS:1000}
      max-backoff-millis: ${RAMALS_AI_DISPATCHER_MAX_BACKOFF_MS:60000}
  security:
    web-origin: ${RAMALS_WEB_ORIGIN:http://localhost:5173}
    # Two tiers, and the placeholder defaults must equal the defaults in RateLimitProperties.
    # RateLimitPropertiesContractTests fails if they drift: this file previously bound the
    # pre-authentication tier to 120/60 -- the subject tier's numbers -- which silently reinstated
    # the single-tier behaviour the two-tier split exists to remove, because a value set here always
    # wins over the Java default and nothing compared the two.
    rate-limit:
      enabled: ${RAMALS_RATE_LIMIT_ENABLED:true}
      # Pre-authentication, keyed on client IP. Deliberately generous: a whole school or office
      # behind one NAT shares this bucket, and throttling them as a group is not the intent.
      capacity: ${RAMALS_RATE_LIMIT_CAPACITY:600}
      refill-per-second: ${RAMALS_RATE_LIMIT_REFILL_PER_SECOND:300}
      # Post-authentication, keyed on the verified token subject. These are the limits an individual
      # learner actually experiences. Bound explicitly so they are configurable per environment --
      # previously they were reachable only by editing Java.
      subject:
        capacity: ${RAMALS_RATE_LIMIT_SUBJECT_CAPACITY:120}
        refill-per-second: ${RAMALS_RATE_LIMIT_SUBJECT_REFILL_PER_SECOND:60}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Full sampling by default for MVP-0 so every failure is traceable; lower in production
    # via RAMALS_TRACE_SAMPLE. Trace/span ids are safe identifiers; no tokens, credentials, or
    # learner free text are ever placed on spans or in structured logs.
    sampling:
      probability: ${RAMALS_TRACE_SAMPLE:1.0}
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
