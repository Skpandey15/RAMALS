spring:
  application:
    name: ramals-learning-platform
  datasource:
    url: ${RAMALS_DB_URL}
    username: ${RAMALS_DB_USER}
    password: ${RAMALS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${RAMALS_DB_URL}
    user: ${RAMALS_DB_MIGRATION_USER:ramals_core_migration}
    password: ${RAMALS_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: core
    schemas: core,ledger,audit,identity
    create-schemas: true
    validate-migration-naming: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RAMALS_OIDC_ISSUER_URI:http://localhost:8081/realms/ramals}
          audiences: ${RAMALS_OIDC_AUDIENCE:ramals-api}

ramals:
  ai:
    base-url: ${RAMALS_AI_BASE_URL:}
    workload-token-url: ${RAMALS_AI_WORKLOAD_TOKEN_URL:}
    workload-client-id: ${RAMALS_AI_WORKLOAD_CLIENT_ID:}
    workload-client-secret: ${RAMALS_AI_WORKLOAD_CLIENT_SECRET:}
    workload-audience: ${RAMALS_AI_WORKLOAD_AUDIENCE:ramals-ai}
    dispatcher:
      enabled: ${RAMALS_AI_DISPATCHER_ENABLED:true}
      poll-interval-ms: ${RAMALS_AI_DISPATCHER_POLL_INTERVAL_MS:1000}
      batch-size: ${RAMALS_AI_DISPATCHER_BATCH_SIZE:4}
      lease-millis: ${RAMALS_AI_DISPATCHER_LEASE_MS:60000}
      max-attempts: ${RAMALS_AI_DISPATCHER_MAX_ATTEMPTS:5}
      initial-backoff-millis: ${RAMALS_AI_DISPATCHER_INITIAL_BACKOFF_MS:1000}
      max-backoff-millis: ${RAMALS_AI_DISPATCHER_MAX_BACKOFF_MS:60000}
  # Contract B: durable recoverable AI execution. Three independent switches, all off.
  #
  # They are separate because they authorise different things, and turning one on must not silently
  # turn on another. `enabled` exposes the operator-only commissioning route -- it spends money at a
  # paid provider. `reconciliation.enabled` runs the worker that drives executions forward and
  # recovers lost acknowledgements. `purge.enabled` runs the retention sweep, which *deletes*.
  #
  # Enabling the route without the worker leaves commissioned executions unreconciled; enabling
  # either without the purge leaves the M2-ADR-018 section 9 ceiling unenforced. The safe DEV order
  # is purge, then reconciliation, then the route -- see the Contract B operational runbook.
  contract-b:
    enabled: ${RAMALS_CONTRACT_B_ENABLED:false}
    reconciliation:
      enabled: ${RAMALS_CONTRACT_B_RECONCILIATION_ENABLED:false}
      interval-ms: ${RAMALS_CONTRACT_B_RECONCILIATION_INTERVAL_MS:30000}
      batch-size: ${RAMALS_CONTRACT_B_RECONCILIATION_BATCH_SIZE:20}
      inspection-budget-per-pass: ${RAMALS_CONTRACT_B_INSPECTION_BUDGET_PER_PASS:15}
    purge:
      enabled: ${RAMALS_CONTRACT_B_PURGE_ENABLED:false}
      interval-ms: ${RAMALS_CONTRACT_B_PURGE_INTERVAL_MS:21600000}
      retention-days: ${RAMALS_CONTRACT_B_PURGE_RETENTION_DAYS:30}
      batch-size: ${RAMALS_CONTRACT_B_PURGE_BATCH_SIZE:500}
  security:
    web-origin: ${RAMALS_WEB_ORIGIN:http://localhost:5173}
    # Two tiers, and the placeholder defaults must equal the defaults in RateLimitProperties.
    # RateLimitPropertiesContractTests fails if they drift: this file previously bound the
    # pre-authentication tier to 120/60 -- the subject tier's numbers -- which silently reinstated
    # the single-tier behaviour the two-tier split exists to remove, because a value set here always
    # wins over the Java default and nothing compared the two.
    rate-limit:
      enabled: ${RAMALS_RATE_LIMIT_ENABLED:true}
      # Pre-authentication, keyed on client IP. Deliberately generous: a whole school or office
      # behind one NAT shares this bucket, and throttling them as a group is not the intent.
      capacity: ${RAMALS_RATE_LIMIT_CAPACITY:600}
      refill-per-second: ${RAMALS_RATE_LIMIT_REFILL_PER_SECOND:300}
      # Post-authentication, keyed on the verified token subject. These are the limits an individual
      # learner actually experiences. Bound explicitly so they are configurable per environment --
      # previously they were reachable only by editing Java.
      subject:
        capacity: ${RAMALS_RATE_LIMIT_SUBJECT_CAPACITY:120}
        refill-per-second: ${RAMALS_RATE_LIMIT_SUBJECT_REFILL_PER_SECOND:60}
  registration:
    enabled: ${RAMALS_REGISTRATION_ENABLED:false}
    environment: ${RAMALS_ENVIRONMENT:dev}
    keycloak:
      base-url: ${RAMALS_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
      realm: ${RAMALS_KEYCLOAK_REALM:ramals}
      client-id: ${RAMALS_REGISTRATION_ADMIN_CLIENT_ID:ramals-registration-admin}
      client-secret: ${RAMALS_REGISTRATION_ADMIN_CLIENT_SECRET:}
    consent:
      terms-version: ${RAMALS_TERMS_VERSION:terms-v1}
      terms-ref: ${RAMALS_TERMS_REF:terms-v1}
      privacy-version: ${RAMALS_PRIVACY_VERSION:privacy-v1}
      privacy-ref: ${RAMALS_PRIVACY_REF:privacy-v1}
      adult-statement-version: ${RAMALS_ADULT_STATEMENT_VERSION:adult-18-v1}
    otp:
      hmac-key-version: ${RAMALS_OTP_HMAC_KEY_VERSION:v1}
      hmac-key-ring: ${RAMALS_OTP_HMAC_KEYS:}
      policy-version: ${RAMALS_OTP_POLICY_VERSION:otp-v1}
      ttl-seconds: ${RAMALS_OTP_TTL_SECONDS:300}
      resend-cooldown-seconds: ${RAMALS_OTP_RESEND_COOLDOWN_SECONDS:45}
      max-attempts: ${RAMALS_OTP_MAX_ATTEMPTS:5}
    sms:
      provider: ${RAMALS_SMS_PROVIDER:fake}
      global-hourly-budget: ${RAMALS_SMS_GLOBAL_HOURLY_BUDGET:100}
      abuse-counter-retention-days: ${RAMALS_ABUSE_COUNTER_RETENTION_DAYS:7}
    abuse-counter-purge:
      enabled: ${RAMALS_ABUSE_COUNTER_PURGE_ENABLED:true}
      interval-ms: ${RAMALS_ABUSE_COUNTER_PURGE_INTERVAL_MS:3600000}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Full sampling by default for MVP-0 so every failure is traceable; lower in production
    # via RAMALS_TRACE_SAMPLE. Trace/span ids are safe identifiers; no tokens, credentials, or
    # learner free text are ever placed on spans or in structured logs.
    sampling:
      probability: ${RAMALS_TRACE_SAMPLE:1.0}
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
