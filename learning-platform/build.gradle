plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 25
  options.encoding = 'UTF-8'
}

dependencies {
  implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
  implementation 'net.ttddyy.observation:datasource-micrometer-opentelemetry:2.2.1'
  // Pinned ahead of the Spring Boot BOM: the managed 42.7.11 carries CVE-2026-54291 (HIGH,
  // scram-client), fixed in 42.7.12. Drop the explicit version once the BOM catches up.
  runtimeOnly 'org.postgresql:postgresql:42.7.12'
  runtimeOnly 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testRuntimeOnly 'com.h2database:h2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
  toolVersion = '0.8.13'
}

// Coverage is reported over the whole module without exclusions: filtering out DTOs and records
// would inflate the figure without telling us anything useful about the engine's tested behaviour.
tasks.named('jacocoTestReport') {
  dependsOn tasks.named('test')
  reports {
    xml.required = true
    html.required = true
    csv.required = true
  }
}
