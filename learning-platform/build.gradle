plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 25
  options.encoding = 'UTF-8'
}

dependencies {
  implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
  implementation 'net.ttddyy.observation:datasource-micrometer-opentelemetry:2.2.1'
  // Pinned ahead of the Spring Boot BOM: the managed 42.7.11 carries CVE-2026-54291 (HIGH,
  // scram-client), fixed in 42.7.12. Drop the explicit version once the BOM catches up.
  runtimeOnly 'org.postgresql:postgresql:42.7.12'
  runtimeOnly 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testRuntimeOnly 'com.h2database:h2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  // The PostgreSQL-backed suites below deliberately reset shared schemas. Keep the default
  // unit-test task deterministic as well when a CI invocation enables JUnit parallel execution.
  maxParallelForks = 1
  systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
  systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
  systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'same_thread'
  // Pinned, not inherited. The JDBC driver sends the JVM's default zone to PostgreSQL on connect,
  // and PostgreSQL 18 rejects legacy aliases such as Asia/Calcutta -- so the whole database-backed
  // suite fails at @BeforeAll for a developer in that zone while CI, which runs UTC, stays green.
  // Pinning also keeps date and timestamp assertions independent of where they are run.
  systemProperty 'user.timezone', 'UTC'
  // Keep the default task fast: integration, architecture, and governance suites run through
  // their own tasks below and are wired into check.
  filter {
    excludeTestsMatching '**/*IntegrationTests'
    excludeTestsMatching '**/*ContractTests'
    excludeTestsMatching '**/*MigrationContractTests'
    excludeTestsMatching '**/*AdrRegisterTests'
    excludeTestsMatching '**/*DeploymentLoggingTests'
    excludeTestsMatching '**/*DomainNeutralityTests'
    excludeTestsMatching '**/*EngineVersionFreezeTests'
    excludeTestsMatching '**/*EvaluationAuthorityBoundaryTests'
    excludeTestsMatching '**/*Mvp0ReleaseRecordConformanceTests'
    excludeTestsMatching '**/*Mvp1ReleaseBoardTests'
    excludeTestsMatching '**/*MvpZeroValidationTests'
    excludeTestsMatching '**/*NegativeAuthorizationTests'
    excludeTestsMatching '**/*RealmHardeningTests'
    excludeTestsMatching '**/*ReleasePipelineTests'
    excludeTestsMatching '**/*SecurityDenialAuditTests'
    excludeTestsMatching '**/*SecurityHeadersApiTests'
    excludeTestsMatching '**/*SecurityContractTests'
    excludeTestsMatching '**/*SubjectRateLimitApiTests'
    excludeTestsMatching '*ArchitectureGuardrailTests'
  }
}

def registerCategoryTest = { String name, String description, List<String> includes ->
  tasks.register(name, Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = description
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    // Integration and governance fixtures use one shared PostgreSQL database and reset schemas.
    // Serialize both Gradle workers and JUnit classes so their @BeforeAll reset hooks cannot
    // invalidate another class that is still executing.
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'same_thread'
  // Pinned, not inherited. The JDBC driver sends the JVM's default zone to PostgreSQL on connect,
  // and PostgreSQL 18 rejects legacy aliases such as Asia/Calcutta -- so the whole database-backed
  // suite fails at @BeforeAll for a developer in that zone while CI, which runs UTC, stays green.
  // Pinning also keeps date and timestamp assertions independent of where they are run.
  systemProperty 'user.timezone', 'UTC'
    filter {
      includes.each { includeTestsMatching(it) }
    }
  }
}

def integrationTest = registerCategoryTest(
    'integrationTest',
    'Runs PostgreSQL- and runtime-backed integration tests.',
    ['*IntegrationTests'])

// Architecture tests protect security, authority, and platform-boundary decisions. They are
// intentionally named explicitly so a new governance test cannot silently land in this category.
def architectureTest = registerCategoryTest(
    'architectureTest',
    'Runs architecture and security-boundary tests.',
    [
      '*DomainNeutralityTests',
      '*EvaluationAuthorityBoundaryTests',
      '*NegativeAuthorizationTests',
      '*RealmHardeningTests',
      '*SecurityContractTests',
      '*SecurityDenialAuditTests',
      '*SecurityHeadersApiTests',
      '*SubjectRateLimitApiTests',
      '*ArchitectureGuardrailTests'
    ])

// Governance tests validate contracts, migrations, release records, and repository policy. Keep
// the external-file inputs on this task only: changing a contract or ADR should not invalidate a
// unit-test task that cannot observe those files.
def governanceTest = registerCategoryTest(
    'governanceTest',
    'Runs contract, migration, release, and governance tests.',
    [
      '*ContractTests',
      '*MigrationContractTests',
      '*AdrRegisterTests',
      '*DeploymentLoggingTests',
      '*EngineVersionFreezeTests',
      '*Mvp0ReleaseRecordConformanceTests',
      '*Mvp1BaselineRecordTests',
      '*Mvp1ReleaseBoardTests',
      '*MvpZeroValidationTests',
      '*ReleasePipelineTests'
    ])

governanceTest.configure {
  inputs.file(rootProject.file('.env.example'))
      .withPropertyName('envExample')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('infrastructure/docker/keycloak/ramals-realm.json'))
      .withPropertyName('keycloakRealm')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('contracts'))
      .withPropertyName('aiContract')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('docs/adr'))
      .withPropertyName('adrs')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('docs/release/mvp0-release-candidate.md'))
      .withPropertyName('releaseRecord')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('deploy/compose.deploy.yml'))
      .withPropertyName('deployTopology')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('docs/release/mvp1-release-board.md'))
      .withPropertyName('releaseBoard')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  // RateLimitPropertiesContractTests reads this to check that every rate-limit variable the
  // performance override sets actually binds to a property. Undeclared, an edit to it would leave
  // the task up to date and the check unrun — locally silent, since CI always starts clean.
  inputs.file(rootProject.file('performance/compose.perf-override.yml'))
      .withPropertyName('performanceRateLimitOverride')
      .withPathSensitivity(PathSensitivity.RELATIVE)
}

// These suites intentionally reset and re-provision the same PostgreSQL database. Run the
// governance fresh-install validation first, then the individual integration fixtures, so a
// preceding integration suite cannot leave database ownership/privilege state that prevents the
// governance bootstrap from running.
integrationTest.configure {
  mustRunAfter(governanceTest)
  mustRunAfter(architectureTest)
}

architectureTest.configure {
  mustRunAfter(governanceTest)
}

integrationTest.configure {
  // PostgreSQL persistence suites are enabled by environment variables. Keep these inputs on the
  // integration task so changing test mode cannot cause Gradle to reuse a non-integration result.
  inputs.property('postgresTestUrl', providers.environmentVariable('RAMALS_TEST_POSTGRES_URL').orElse(''))
  inputs.property('postgresTestAdminUser', providers.environmentVariable('RAMALS_TEST_POSTGRES_ADMIN_USER').orElse(''))
  inputs.property('postgresTestEnabled', providers.environmentVariable('RAMALS_TEST_POSTGRES_ALLOW_RESET').orElse(''))
  inputs.property('postgresTestAdminPasswordConfigured',
      providers.environmentVariable('RAMALS_TEST_POSTGRES_ADMIN_PASSWORD')
          .map { it.isBlank() ? 'false' : 'true' }
          .orElse('false'))
}

tasks.named('check') {
  dependsOn integrationTest, architectureTest, governanceTest
}

tasks.named('test') {
  finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
  toolVersion = '0.8.13'
}

// Coverage is reported over the whole module without exclusions: filtering out DTOs and records
// would inflate the figure without telling us anything useful about the engine's tested behaviour.
tasks.named('jacocoTestReport') {
  dependsOn tasks.named('test')
  reports {
    xml.required = true
    html.required = true
    csv.required = true
  }
}
