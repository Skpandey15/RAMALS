plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 25
  options.encoding = 'UTF-8'
}

dependencies {
  implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
  implementation 'net.ttddyy.observation:datasource-micrometer-opentelemetry:2.2.1'
  // Pinned ahead of the Spring Boot BOM: the managed 42.7.11 carries CVE-2026-54291 (HIGH,
  // scram-client), fixed in 42.7.12. Drop the explicit version once the BOM catches up.
  runtimeOnly 'org.postgresql:postgresql:42.7.12'
  runtimeOnly 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testRuntimeOnly 'com.h2database:h2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy tasks.named('jacocoTestReport')

  // PostgreSQL persistence suites are enabled by environment variables. Include their test-mode
  // inputs in Gradle's up-to-date checks; otherwise a plain unit-test run can be cached and reused
  // after PostgreSQL integration tests are enabled, producing an incomplete JaCoCo report.
  inputs.property('postgresTestUrl', providers.environmentVariable('RAMALS_TEST_POSTGRES_URL').orElse(''))
  inputs.property('postgresTestAdminUser', providers.environmentVariable('RAMALS_TEST_POSTGRES_ADMIN_USER').orElse(''))
  inputs.property('postgresTestEnabled', providers.environmentVariable('RAMALS_TEST_POSTGRES_ALLOW_RESET').orElse(''))
  inputs.property('postgresTestAdminPasswordConfigured',
      providers.environmentVariable('RAMALS_TEST_POSTGRES_ADMIN_PASSWORD').map { it.isBlank() ? 'false' : 'true' }.orElse('false'))

  // Several suites assert on files outside this module: the Keycloak realm, the release record and
  // ADRs, the AI contract and its golden fixtures, and .env.example. Gradle cannot see those, so
  // without declaring them it treats the task as up to date when only one of them changes -- and
  // the guard silently does not run.
  //
  // Found by perturbing the realm: dropping the audience mapper, enabling direct grants and
  // committing a client secret all left the build green, because the tests never re-ran. This
  // affected the pre-existing learner_id and MFA assertions too.
  inputs.file(rootProject.file('.env.example'))
      .withPropertyName('envExample')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('infrastructure/docker/keycloak/ramals-realm.json'))
      .withPropertyName('keycloakRealm')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('contracts'))
      .withPropertyName('aiContract')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('docs/adr'))
      .withPropertyName('adrs')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('docs/release/mvp0-release-candidate.md'))
      .withPropertyName('releaseRecord')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('deploy/compose.deploy.yml'))
      .withPropertyName('deployTopology')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(rootProject.file('docs/release/mvp1-release-board.md'))
      .withPropertyName('releaseBoard')
      .withPathSensitivity(PathSensitivity.RELATIVE)
}

jacoco {
  toolVersion = '0.8.13'
}

// Coverage is reported over the whole module without exclusions: filtering out DTOs and records
// would inflate the figure without telling us anything useful about the engine's tested behaviour.
tasks.named('jacocoTestReport') {
  dependsOn tasks.named('test')
  reports {
    xml.required = true
    html.required = true
    csv.required = true
  }
}
