plugins {
  id 'base'
  id 'org.springframework.boot' version '4.1.0' apply false
}

allprojects {
  group = 'io.ramals'
  // Frozen for the MVP-0 release candidate (M0-T23). Bump deliberately for the next candidate or
  // release; the deterministic algorithm and policy versions are frozen independently so historical
  // decisions stay reproducible.
  version = '0.1.0-rc2'

  repositories {
    mavenCentral()
  }
}

