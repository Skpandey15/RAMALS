apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sms-sink-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-sink
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: sms-sink}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sms-sink}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sms-sink
          image: ramals/sms-sink:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SMS_DB, value: /data/sms.db}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sms-sink-data}
---
apiVersion: v1
kind: Service
metadata:
  name: sms-sink
spec:
  selector: {app.kubernetes.io/name: sms-sink}
  ports:
    - {name: http, port: 8080, targetPort: http}
