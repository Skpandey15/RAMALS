apiVersion: v1
kind: Service
metadata:
  name: web-ui
spec:
  selector: {app.kubernetes.io/name: web-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web-ui}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web-ui
          image: ramals/web-ui:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 32Mi}}
        - {name: nginx-run, emptyDir: {sizeLimit: 4Mi}}
