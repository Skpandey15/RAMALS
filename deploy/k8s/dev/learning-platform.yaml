apiVersion: v1
kind: Service
metadata:
  name: learning-platform
spec:
  selector: {app.kubernetes.io/name: learning-platform}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app.kubernetes.io/name: learning-platform}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: learning-platform}
  template:
    metadata:
      labels: {app.kubernetes.io/name: learning-platform}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: learning-platform
          image: ramals/learning-platform:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: ramals-dev-config}
          env:
            - {name: RAMALS_DB_USER, value: ramals_core_runtime}
            - name: RAMALS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: db-runtime-password}}
            - name: RAMALS_DB_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: db-migration-password}}
            - name: RAMALS_ADMIN_IDENTITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ramals-dev-identity-admin
                  key: RAMALS_ADMIN_IDENTITY_CLIENT_SECRET
                  optional: true
            - name: RAMALS_REGISTRATION_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ramals-dev-registration-admin
                  key: RAMALS_REGISTRATION_ADMIN_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
