apiVersion: v1
kind: ConfigMap
metadata:
  name: ramals-dev-config
data:
  SPRING_PROFILES_ACTIVE: shared
  RAMALS_DB_URL: jdbc:postgresql://postgres:5432/ramals
  RAMALS_DB_MIGRATION_USER: ramals_core_migration
  # Must be the SAME URL the browser uses, or Keycloak stamps `iss` with one host and the platform
  # validates against another -- login succeeds and every API call then 401s. `keycloak.localhost`
  # resolves to 127.0.0.1 in the browser and, via the CoreDNS rewrite bootstrap.ps1 installs, to the
  # keycloak Service inside the cluster. One URL, both sides.
  RAMALS_OIDC_ISSUER_URI: http://keycloak.localhost:8080/realms/ramals
  RAMALS_OIDC_AUDIENCE: ramals-api
  RAMALS_WEB_ORIGIN: http://localhost:8080
  RAMALS_ADMIN_IDENTITY_BASE_URL: http://keycloak:8080
  RAMALS_ADMIN_IDENTITY_REALM: ramals
  RAMALS_ADMIN_IDENTITY_CLIENT_ID: ramals-identity-admin
  RAMALS_REGISTRATION_ENABLED: "true"
  RAMALS_ENVIRONMENT: dev
  # DEV only. `fake` discards the code, which is right for CI and leaves a person unable to finish
  # onboarding by hand. `mailpit` delivers it to the in-cluster inbox instead of a handset. It is
  # absent from SmsProviderCatalog.PRODUCTION_CAPABLE, so a production context naming it fails at
  # startup -- selecting it here changes where a DEV code goes and nothing about what production
  # will accept. The application.yml default stays `fake`, so this opt-in lives only in DEV.
  RAMALS_SMS_PROVIDER: mailpit
  # The sink's transport. Absent in production, so no JavaMailSender is created there at all and
  # the sink has nothing to send through even if it were somehow selected.
  SPRING_MAIL_HOST: mailpit
  SPRING_MAIL_PORT: "1025"
  RAMALS_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
  RAMALS_KEYCLOAK_REALM: ramals
  RAMALS_REGISTRATION_ADMIN_CLIENT_ID: ramals-registration-admin
  # Requests reach the platform from the Traefik ingress and the web-ui pod, both inside the cluster
  # pod network, and only those may set X-Forwarded-For on our behalf. k3d's default pod CIDR; widen
  # or narrow to match the cluster, and never set 0.0.0.0/0 -- that trusts every caller's header.
  RAMALS_TRUSTED_PROXIES: 10.42.0.0/16
  RAMALS_AI_BASE_URL: http://ramals-ai:8000
  RAMALS_AI_DISPATCHER_ENABLED: "false"
  RAMALS_CONTRACT_B_ENABLED: "false"
  RAMALS_CONTRACT_B_RECONCILIATION_ENABLED: "false"
  RAMALS_CONTRACT_B_PURGE_ENABLED: "false"
  RAMALS_ORCHESTRATION_ENABLED: "false"
  RAMALS_TRACE_SAMPLE: "1.0"
