apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9000, targetPort: management}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: ramals/keycloak:local
          imagePullPolicy: IfNotPresent
          args: [start, --optimized, --import-realm]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: jdbc:postgresql://postgres:5432/keycloak}
            - {name: KC_DB_USERNAME, value: keycloak_local}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: keycloak-db-password}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: ramals-local-admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: keycloak-admin-password}}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            # Keycloak must generate browser-facing links with the same ingress hostname used by
            # the SPA and the backend issuer configuration. Without this, action emails can contain
            # the in-cluster service URL (http://keycloak:8080), which Windows cannot resolve.
            - {name: KC_HOSTNAME, value: "http://keycloak.localhost:8080"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_CACHE, value: local}
          lifecycle:
            # Startup realm import uses IGNORE_EXISTING. That is safe for persisted DEV users, but it
            # also means an older persisted realm never receives later SMTP settings from
            # ramals-realm.json. Reconcile only the DEV SMTP map after Keycloak is reachable so both
            # fresh and already-existing clusters deterministically deliver verification mail to the
            # in-cluster Mailpit service.
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    K=/opt/keycloak/bin/kcadm.sh
                    until "$K" get realms/ramals \
                      --no-config --server http://localhost:8080 --realm master \
                      --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" \
                      >/dev/null 2>&1; do
                      sleep 2
                    done
                    cat >/tmp/ramals-dev-smtp.json <<'EOF'
                    {"smtpServer":{"host":"mailpit","port":"1025","from":"no-reply@ramals.local","fromDisplayName":"RAMALS","auth":"false","ssl":"false","starttls":"false"}}
                    EOF
                    "$K" update realms/ramals -f /tmp/ramals-dev-smtp.json \
                      --no-config --server http://localhost:8080 --realm master \
                      --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD"
                    rm -f /tmp/ramals-dev-smtp.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
