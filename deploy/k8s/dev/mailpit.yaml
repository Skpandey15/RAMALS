# Mailpit stores captured mail in a SQLite database. Left at its default under /tmp that database
# lives in the container filesystem, so every restart silently destroys every message. In DEV that
# is not a cosmetic loss: email verification links are the only way to finish registration, and the
# registration API deliberately returns the same response whether or not an address already exists
# (anti-enumeration), so a learner whose verification mail was discarded cannot recover it by
# registering again. The mailbox is therefore state worth keeping, and gets a volume like Postgres.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  # ReadWriteOnce cannot be held by an old and a new pod at once, and a RollingUpdate waits for the
  # new pod before removing the old -- which never resolves. Recreate is the only strategy that
  # terminates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # A freshly provisioned local-path volume is root-owned. Without fsGroup the non-root
        # container cannot create its database on the very volume added to preserve it.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # Explicit, and on the mounted volume. The default path is under /tmp.
            - name: MP_DATABASE
              value: /data/mailpit.db
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          volumeMounts:
            - name: mailpit-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: mailpit-data
          persistentVolumeClaim:
            claimName: mailpit-data
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
