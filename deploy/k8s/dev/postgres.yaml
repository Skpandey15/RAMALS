apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ramals/postgres:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ramals
            - name: POSTGRES_USER
              value: ramals_bootstrap
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: db-admin-password}}
            - name: RAMALS_DB_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: db-migration-password}}
            - name: RAMALS_DB_RUNTIME_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: db-runtime-password}}
            - name: KEYCLOAK_DB_NAME
              value: keycloak
            - name: KEYCLOAK_DB_USER
              value: keycloak_local
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ramals-dev-runtime, key: keycloak-db-password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
