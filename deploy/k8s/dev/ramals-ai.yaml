apiVersion: v1
kind: Service
metadata:
  name: ramals-ai
spec:
  selector: {app.kubernetes.io/name: ramals-ai}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramals-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ramals-ai}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ramals-ai}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ramals-ai
          image: ramals/ramals-ai:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: RAMALS_AI_ENVIRONMENT, value: local}
            - {name: RAMALS_AI_AI_ENABLED, value: "false"}
            - {name: RAMALS_AI_MODEL_ROUTE, value: ci-fake}
            - {name: RAMALS_AI_DURABLE_EXECUTION_ENABLED, value: "false"}
            - {name: RAMALS_AI_WORKLOAD_AUTH_ENABLED, value: "false"}
            - {name: RAMALS_AI_LOG_LEVEL, value: INFO}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
