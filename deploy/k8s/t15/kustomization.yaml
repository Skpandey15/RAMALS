apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# M2-T15 qualification only. This is intentionally separate from deploy/compose.deploy.yml and
# carries no production trigger or activation wiring.
namespace: ramals-t15

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - keycloak.yaml
  - keycloak-client-bootstrap.yaml
  - workload-identity-smoke.yaml
  - learning-platform.yaml
  - ramals-ai.yaml
  - web-ui.yaml

# These are manifest-list digests of the artifacts built from current main for this qualification
# run. Kustomize emits image@sha256:... references; tags are used only as transformer keys and never
# reach the cluster.
images:
  - name: qualification/learning-platform:current-main
    newName: k3d-ramals-t15-registry:5000/ramals-learning-platform
    digest: sha256:04098418c57283bc01c8ef3d2f752a4bda9d76e936746213ab6b6544d101dfa4
  - name: qualification/ramals-ai:current-main
    newName: k3d-ramals-t15-registry:5000/ramals-ai
    digest: sha256:456dd3f13e8e3d96f19924144df2cd82260c3c535710b0055ec3e21606a9778e
  - name: qualification/web-ui:current-main
    newName: k3d-ramals-t15-registry:5000/ramals-web-ui
    digest: sha256:bc378000b0ef4d3d1e690c3785072430cf549d17262dfe75b52e1e85eb5a8e0e
  - name: qualification/postgres:current-main
    newName: k3d-ramals-t15-registry:5000/ramals-postgres
    digest: sha256:96dc42b5620ec2344e15236ceda3bad5d863f2b952e9bc7d5fd4269866570eca
  - name: qualification/keycloak:current-main
    newName: k3d-ramals-t15-registry:5000/ramals-keycloak
    digest: sha256:67c13631a9ca79c95e32363abd88c5cb687a274df56e824221553ca758704947
