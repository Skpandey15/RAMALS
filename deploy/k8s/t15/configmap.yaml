apiVersion: v1
kind: ConfigMap
metadata:
  name: ramals-t15-platform-config
  labels:
    ramals.io/qualification: m2-t15
data:
  SPRING_PROFILES_ACTIVE: shared
  RAMALS_DB_URL: jdbc:postgresql://postgres:5432/ramals
  RAMALS_DB_MIGRATION_USER: ramals_core_migration
  RAMALS_OIDC_ISSUER_URI: http://keycloak:8080/realms/ramals
  RAMALS_OIDC_AUDIENCE: ramals-api
  RAMALS_WEB_ORIGIN: http://localhost:5173
  RAMALS_AI_BASE_URL: http://ramals-ai:8000
  RAMALS_AI_WORKLOAD_TOKEN_URL: http://keycloak:8080/realms/ramals/protocol/openid-connect/token
  RAMALS_AI_WORKLOAD_CLIENT_ID: ramals-core-workload
  RAMALS_AI_WORKLOAD_AUDIENCE: ramals-ai
  RAMALS_AI_DISPATCHER_ENABLED: "true"
  RAMALS_AI_DISPATCHER_POLL_INTERVAL_MS: "1000"
  RAMALS_AI_DISPATCHER_BATCH_SIZE: "4"
  RAMALS_AI_DISPATCHER_LEASE_MS: "60000"
  RAMALS_AI_DISPATCHER_MAX_ATTEMPTS: "5"
  RAMALS_AI_DISPATCHER_INITIAL_BACKOFF_MS: "1000"
  RAMALS_AI_DISPATCHER_MAX_BACKOFF_MS: "60000"
  # Explicit for qualification. This is not production activation or trigger wiring; it only lets
  # the isolated T15 namespace exercise the already implemented M2-T14 polling advancer.
  RAMALS_ORCHESTRATION_ENABLED: "true"
  RAMALS_ORCHESTRATION_POLL_INTERVAL_MS: "1000"
  RAMALS_ORCHESTRATION_BATCH_SIZE: "16"
  RAMALS_TRACE_SAMPLE: "1.0"
