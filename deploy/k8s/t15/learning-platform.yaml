apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: learning-platform
    ramals.io/qualification: m2-t15
spec:
  selector:
    app.kubernetes.io/name: learning-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: learning-platform
  labels:
    app.kubernetes.io/name: learning-platform
    ramals.io/qualification: m2-t15
spec:
  selector:
    app.kubernetes.io/name: learning-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-platform
  labels:
    app.kubernetes.io/name: learning-platform
    ramals.io/qualification: m2-t15
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: learning-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learning-platform
        ramals.io/qualification: m2-t15
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: learning-platform
      initContainers:
        - name: wait-for-platform-dependencies
          image: k3d-ramals-t15-registry:5000/ramals-t15-busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              until nc -z postgres 5432; do sleep 2; done
              until wget -q -O - http://keycloak:9000/health/ready | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: learning-platform
          image: qualification/learning-platform:current-main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ramals-t15-platform-config
          env:
            - name: RAMALS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ramals-t15-runtime
                  key: db-runtime-user
            - name: RAMALS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramals-t15-runtime
                  key: db-runtime-password
            - name: RAMALS_DB_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramals-t15-runtime
                  key: db-migration-password
            - name: RAMALS_AI_WORKLOAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ramals-t15-runtime
                  key: workload-client-secret
            # Qualification-only claimant identity. The application reads these only when the
            # disabled-by-default WORKFLOW_AFTER_CLAIM barrier is explicitly armed.
            - name: RAMALS_QUALIFICATION_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RAMALS_QUALIFICATION_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RAMALS_QUALIFICATION_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
