apiVersion: v1
kind: Service
metadata:
  name: ramals-ai
  labels:
    app.kubernetes.io/name: ramals-ai
    ramals.io/qualification: m2-t15
spec:
  selector:
    app.kubernetes.io/name: ramals-ai
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramals-ai
  labels:
    app.kubernetes.io/name: ramals-ai
    ramals.io/qualification: m2-t15
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ramals-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramals-ai
        ramals.io/qualification: m2-t15
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ramals-ai
      containers:
        - name: ramals-ai
          image: qualification/ramals-ai:current-main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RAMALS_AI_ENVIRONMENT
              value: test
            - name: RAMALS_AI_AI_ENABLED
              value: "true"
            - name: RAMALS_AI_MODEL_ROUTE
              value: ci-fake
            - name: RAMALS_AI_WORKLOAD_AUTH_ENABLED
              value: "true"
            - name: RAMALS_AI_OIDC_ISSUER
              value: http://keycloak:8080/realms/ramals
            - name: RAMALS_AI_OIDC_AUDIENCE
              value: ramals-ai
            - name: RAMALS_AI_EXPECTED_WORKLOAD_CLIENT_ID
              value: ramals-core-workload
            - name: RAMALS_AI_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
