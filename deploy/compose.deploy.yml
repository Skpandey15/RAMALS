# Deployment topology for the shared dev environment.
#
# Unlike infrastructure/docker/compose.yml, which builds from source for local development, this
# file never builds: it consumes the exact immutable digests exported by deploy-controller.sh from
# the approved desired-version manifest. That is what makes build-once/promote-the-same-artifact
# real — the bytes running here are the bytes that were built, scanned and attested in CI.
name: ramals-deploy

services:
  postgres:
    build:
      context: ../
      dockerfile: infrastructure/docker/postgres-init/Dockerfile
    environment:
      POSTGRES_DB: ${RAMALS_DB_NAME:?Set RAMALS_DB_NAME}
      POSTGRES_USER: ${RAMALS_DB_ADMIN_USER:?Set RAMALS_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${RAMALS_DB_ADMIN_PASSWORD:?Set RAMALS_DB_ADMIN_PASSWORD}
      RAMALS_DB_MIGRATION_PASSWORD: ${RAMALS_DB_MIGRATION_PASSWORD:?Set RAMALS_DB_MIGRATION_PASSWORD}
      RAMALS_DB_RUNTIME_PASSWORD: ${RAMALS_DB_RUNTIME_PASSWORD:?Set RAMALS_DB_RUNTIME_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - deploy-postgres-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  keycloak:
    build:
      context: ../
      dockerfile: infrastructure/docker/keycloak/Dockerfile
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${RAMALS_KEYCLOAK_ADMIN:?Set RAMALS_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RAMALS_KEYCLOAK_ADMIN_PASSWORD:?Set RAMALS_KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data, edge]
    ports: ["127.0.0.1:${RAMALS_KEYCLOAK_PORT:-8081}:8080"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  # Published, digest-pinned artefacts. deploy-controller.sh exports these from the manifest and
  # refuses to proceed unless they are sha256 digests.
  backend:
    image: ${RAMALS_BACKEND_IMAGE:?deploy-controller.sh must export RAMALS_BACKEND_IMAGE}
    environment:
      # Without this the default profile wins and Spring's console pattern drops the MDC fields,
      # so interactionId never reaches the log stream. The diagnosis procedure in
      # docs/architecture/observability-correlation.md then cannot be carried out at all: the
      # support code the learner was shown matches nothing. Guarded by DeploymentLoggingTests.
      SPRING_PROFILES_ACTIVE: ${RAMALS_SPRING_PROFILES:-shared}
      RAMALS_DB_URL: jdbc:postgresql://postgres:5432/${RAMALS_DB_NAME:?Set RAMALS_DB_NAME}
      RAMALS_DB_USER: ${RAMALS_DB_RUNTIME_USER:-ramals_core_runtime}
      RAMALS_DB_PASSWORD: ${RAMALS_DB_RUNTIME_PASSWORD:?Set RAMALS_DB_RUNTIME_PASSWORD}
      RAMALS_DB_MIGRATION_USER: ${RAMALS_DB_MIGRATION_USER:-ramals_core_migration}
      RAMALS_DB_MIGRATION_PASSWORD: ${RAMALS_DB_MIGRATION_PASSWORD:?Set RAMALS_DB_MIGRATION_PASSWORD}
      RAMALS_OIDC_ISSUER_URI: ${RAMALS_OIDC_ISSUER_URI:-http://keycloak:8080/realms/ramals}
      RAMALS_OIDC_AUDIENCE: ${RAMALS_OIDC_AUDIENCE:-ramals-api}
      RAMALS_WEB_ORIGIN: ${RAMALS_WEB_ORIGIN:-http://localhost:5173}
      RAMALS_AI_BASE_URL: ${RAMALS_AI_BASE_URL:-}
      RAMALS_AI_WORKLOAD_TOKEN_URL: ${RAMALS_AI_WORKLOAD_TOKEN_URL:-http://keycloak:8080/realms/ramals/protocol/openid-connect/token}
      RAMALS_AI_WORKLOAD_CLIENT_ID: ${RAMALS_AI_WORKLOAD_CLIENT_ID:-ramals-core-workload}
      RAMALS_AI_WORKLOAD_CLIENT_SECRET: ${RAMALS_AI_WORKLOAD_CLIENT_SECRET:-}
      RAMALS_AI_WORKLOAD_AUDIENCE: ${RAMALS_AI_WORKLOAD_AUDIENCE:-ramals-ai}
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    networks: [data, edge]
    ports: ["127.0.0.1:${RAMALS_BACKEND_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]

  # The AI plane, deployed when the manifest pins it.
  #
  # It was published, digest-pinned, scanned and validated by deploy-controller.sh -- and then not
  # deployed by anything, because no compose file in the repository defined it. MVP-1's defining
  # capability shipped as an artifact nobody could start by the documented path, and the gap was
  # invisible because health-gates.sh skips the plane when AI_URL is unset and reports the
  # deterministic core unaffected, which is true and was passing.
  #
  # Behind a profile so that remains true. A manifest without a ramals-ai component still deploys the
  # core alone; deploy-controller.sh activates this profile only when a digest is actually pinned, so
  # the manifest decides the topology rather than a flag somebody has to remember.
  ramals-ai:
    profiles: [ai-plane]
    image: ${RAMALS_AI_IMAGE:?deploy-controller.sh exports RAMALS_AI_IMAGE when the manifest pins ramals-ai}
    environment:
      RAMALS_AI_ENVIRONMENT: ${RAMALS_AI_ENVIRONMENT:-dev}
      # Workload authentication is the only thing separating the core workload from a replayed
      # learner token, and the plane refuses to start with it disabled outside a local run.
      RAMALS_AI_WORKLOAD_AUTH_ENABLED: "true"
      RAMALS_AI_OIDC_ISSUER: ${RAMALS_AI_OIDC_ISSUER:-http://keycloak:8080/realms/ramals}
      RAMALS_AI_OIDC_AUDIENCE: ${RAMALS_AI_WORKLOAD_AUDIENCE:-ramals-ai}
      RAMALS_AI_EXPECTED_WORKLOAD_CLIENT_ID: ${RAMALS_AI_WORKLOAD_CLIENT_ID:-ramals-core-workload}
      RAMALS_AI_AI_ENABLED: ${RAMALS_AI_AI_ENABLED:-false}
      RAMALS_AI_MODEL_ROUTE: ${RAMALS_AI_MODEL_ROUTE:-ci-fake}
      RAMALS_AI_PROVIDER_API_KEY: ${RAMALS_AI_PROVIDER_API_KEY:-}
      # M1-ADR-008's rollback levers. Without these two passed through, withdrawing a bad prompt or
      # repointing a route needs an image build and a release -- which is the remedy the ADR
      # rejected, because it makes the fastest available fix as slow and as risky as shipping. Both
      # are validated at startup against what the image ships, so a bad pin stops the process.
      # They also select which approved provider serves a route:
      #   RAMALS_AI_MODEL_PINS='{"adaptation-default": "gpt-4.1-2025-04-14"}'
      RAMALS_AI_PROMPT_PINS: ${RAMALS_AI_PROMPT_PINS:-{}}
      RAMALS_AI_MODEL_PINS: ${RAMALS_AI_MODEL_PINS:-{}}
      RAMALS_AI_LOG_LEVEL: ${RAMALS_AI_LOG_LEVEL:-INFO}
    depends_on:
      keycloak: {condition: service_healthy}
    networks: [edge]
    ports: ["127.0.0.1:${RAMALS_AI_PORT:-8000}:8000"]
    # Probed with the interpreter the image already has. The runtime stage carries no curl or wget,
    # so a shell-tool healthcheck would report unhealthy for want of a binary rather than a service.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]

  web-ui:
    image: ${RAMALS_WEBUI_IMAGE:?deploy-controller.sh must export RAMALS_WEBUI_IMAGE}
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    ports: ["127.0.0.1:${RAMALS_WEB_PORT:-5173}:8080"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt: [no-new-privileges:true]

networks:
  data: {internal: true}
  edge: {}

volumes:
  deploy-postgres-data:
