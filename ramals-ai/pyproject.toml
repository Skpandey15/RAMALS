[project]
name = "ramals-ai"
version = "0.1.0"
description = "RAMALS MVP-1 AI execution plane. Proposes; never decides."
requires-python = ">=3.14"

# Exact pins, not ranges: the same discipline the Java and frontend builds use. A dependency bump is
# a reviewed change, not something that happens between two CI runs.
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  # Workload identity (M1-ADR-003): JWKS-backed validation of the Keycloak workload token.
  "pyjwt[crypto]==2.13.0",
  # Cross-service tracing (M1-T04). The Python side continues the trace Spring started; no exporter
  # is configured here, because where spans are shipped is a deployment concern.
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.3",
]

# Deliberately absent, and asserted absent by tests/unit/test_no_database_access.py:
#   - any PostgreSQL driver (psycopg, asyncpg, SQLAlchemy)
#   - any migration tool (alembic)
# The AI plane reaches learner state through the platform API under its own authorisation, never
# through SQL. Flyway under ramals_core_migration is the sole DDL authority for the shared database.

[project.optional-dependencies]
dev = [
  # Contract tooling (M1-ADR-002). datamodel-code-generator emits the Python models from the
  # canonical OpenAPI; the others lint it and keep the committed output honest.
  "datamodel-code-generator==0.73.0",
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "openapi-spec-validator==0.9.0",
  "pyyaml==6.0.3",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramals_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"
# Generated from the contract. Its correctness is enforced by the drift check and the cross-language
# golden fixtures, not by our style rules -- and reformatting it would guarantee drift on every run.
# This must sit at the top level: a [tool.ruff.lint] exclude applies to `ruff check` but not to
# `ruff format`.
exclude = ["src/ramals_ai/contracts/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM", "ARG", "PTH"]
# S101 (assert) is the point of a test file.
# Test tokens and passwords are fixtures, not credentials.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }

[tool.ruff.lint.flake8-bugbear]
# Depends() in a parameter default is the FastAPI dependency-injection idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "ramals_ai.contracts.generated"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/ramals_ai"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
