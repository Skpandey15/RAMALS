openapi: 3.1.0

# The single normative source for the Spring <-> Python boundary (Doc 03 §2).
#
# Python models are generated from this file; Java records are hand-written and validated against it
# by the golden fixtures in contracts/golden/ (M1-ADR-002). Do not define a type on either side that
# is not described here.
#
# Diagnostic, Tutor, Assessment, and Adaptation endpoints are activated. The Adaptation response is
# still a proposal; deterministic Spring policy remains authoritative.

info:
  title: RAMALS internal AI contract
  version: 1.0.0
  summary: Non-authoritative agent proposals for the RAMALS deterministic core.
  description: |
    Every response on this API is a **proposal**. Nothing returned here is authoritative learner
    state. Spring validates each proposal against schema, semantics, trust level and deterministic
    policy before any authoritative write, and the write happens in a new Spring transaction.

    Authentication is a Keycloak client-credentials token carrying the `ramals-ai` audience
    (M1-ADR-003). A learner token is never accepted, and is never forwarded by Spring.

servers:
  - url: http://ramals-ai:8000
    description: In-cluster service address

security:
  - workloadIdentity: []

tags:
  - name: agents
    description: Proposal endpoints. Implemented from M1-T07 onward.
  - name: operational
    description: Health and capability discovery. No learner data.

paths:
  /internal/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [operational]
      summary: Agents, routes and contract version this build serves
      security: []
      responses:
        '200':
          description: Capabilities of this build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'

  /internal/v1/tutor/respond:
    post:
      operationId: tutorRespond
      tags: [agents]
      summary: Personalized explanation or hint
      description: Learner-facing instructional content only. Never alters mastery or evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRequestEnvelope'
      responses:
        '200':
          description: A non-authoritative tutor proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposalEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableProposal' }
        '503': { $ref: '#/components/responses/AiUnavailable' }
        '504': { $ref: '#/components/responses/DeadlineExceeded' }

  /internal/v1/diagnostic/propose:
    post:
      operationId: diagnosticPropose
      tags: [agents]
      summary: Propose the next diagnostic probe
      description: >
        Suggests what to probe next. Deterministic curriculum and prerequisite policy decides
        whether the proposal is eligible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRequestEnvelope'
      responses:
        '200':
          description: A diagnostic proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposalEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableProposal' }
        '503': { $ref: '#/components/responses/AiUnavailable' }
        '504': { $ref: '#/components/responses/DeadlineExceeded' }

  /internal/v1/assessment/propose:
    post:
      operationId: assessmentPropose
      tags: [agents]
      summary: Propose a candidate assessment item or rubric
      description: >
        Generated content is UNVERIFIED and cannot gate progression until promoted through approved
        validation or review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRequestEnvelope'
      responses:
        '200':
          description: An UNVERIFIED candidate item proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposalEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableProposal' }
        '503': { $ref: '#/components/responses/AiUnavailable' }
        '504': { $ref: '#/components/responses/DeadlineExceeded' }

  /internal/v1/assessment/evaluate:
    post:
      operationId: assessmentEvaluate
      tags: [agents]
      summary: Formative evaluation assistance
      description: |
        **FORMATIVE_ONLY (M1-ADR-010).** May return feedback, classifications, rubric suggestions and
        reviewer assistance. Must never create `ledger.evidence`, determine an authoritative score,
        change attempt completion, or affect mastery, confidence, recommendation or progression.

        The response `trustLevel` is always `FORMATIVE_ONLY`; any other value is a contract
        violation and Spring rejects it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRequestEnvelope'
      responses:
        '200':
          description: A formative-only evaluation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposalEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableProposal' }
        '503': { $ref: '#/components/responses/AiUnavailable' }
        '504': { $ref: '#/components/responses/DeadlineExceeded' }

  /internal/v1/adaptation/propose:
    post:
      operationId: adaptationPropose
      tags: [agents]
      summary: Propose the next pedagogical action
      description: >
        Deterministic RecommendationPolicy remains authoritative. Where the agent and the policy
        disagree, the policy wins and the disagreement is recorded for evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRequestEnvelope'
      responses:
        '200':
          description: An adaptation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposalEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableProposal' }
        '503': { $ref: '#/components/responses/AiUnavailable' }
        '504': { $ref: '#/components/responses/DeadlineExceeded' }

components:
  securitySchemes:
    workloadIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak client-credentials token with audience `ramals-ai` (M1-ADR-003). A learner token
        carries the `ramals-api` audience and is rejected here.

  responses:
    BadRequest:
      description: The request envelope is malformed or violates a documented limit
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or wrong-audience workload token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but not the RAMALS core workload
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableProposal:
      description: No valid proposal could be produced within the bounded repair budget
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiUnavailable:
      description: >
        The model route or agent runtime is unavailable. Deterministic learning is unaffected; the
        caller degrades the AI feature rather than failing the learner's action.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DeadlineExceeded:
      description: >
        The caller's absolute deadline elapsed (M1-ADR-001). Fails closed: no partial proposal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ContractVersion:
      type: string
      pattern: '^\d+\.\d+$'
      examples: ['1.0']
      description: Envelope contract version. A breaking change ships a new major version.

    TrustLevel:
      type: string
      description: |
        What a proposal is permitted to influence (Doc 03 §4). None of these authorise an AI
        component to create scored evidence in MVP-1.
      enum:
        - NON_AUTHORITATIVE
        - UNVERIFIED
        - VERIFIED_CONTENT
        - FORMATIVE_ONLY
        - REJECTED
        - APPROVAL_REQUIRED

    AgentType:
      type: string
      enum: [TUTOR, DIAGNOSTIC, ASSESSMENT, ADAPTATION]

    InteractionClass:
      type: string
      description: Deadline class governing this call (M1-ADR-001). Stricter route limits win.
      enum: [FAST, INTERACTIVE_AI, ASSESSMENT_PROPOSAL, LIMITED_DURABLE]

    LearnerRef:
      type: object
      description: >
        Opaque learner reference. Never a database primary key, and never enough on its own to
        identify a person outside the platform.
      additionalProperties: false
      required: [learnerRef]
      properties:
        learnerRef:
          type: string
          minLength: 1
          maxLength: 128
        locale:
          type: string
          maxLength: 16
          examples: ['en-IN']

    LearningContext:
      type: object
      description: >
        Minimized, purpose-specific learner state. Spring sends only what the agent use case needs;
        no full history, no raw keys, no access token.
      additionalProperties: false
      required: [skillCode]
      properties:
        # 96 matches core.skill.stable_code. The boundary was narrower than the authoritative
        # schema, so a skill code of 65-96 characters was storable, legal, and rejected here.
        skillCode:
          type: string
          minLength: 1
          maxLength: 96
        masteryScore:
          $ref: '#/components/schemas/DecimalString'
        evidenceConfidence:
          $ref: '#/components/schemas/DecimalString'
        masteryStatus:
          type: string
          maxLength: 32
          examples: ['NEEDS_PRACTICE']
        # Prerequisites are skill stable codes, so they carry the same width as skillCode. Widening
        # only skillCode would have left the identical defect one field over.
        prerequisites:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 96

    DomainContext:
      type: object
      description: >
        Which learning domain this request is about, and which published curriculum version defines
        it. Present so an agent never has to assume the domain: the platform is domain-neutral by
        construction, and the first domain must not become the permanent one by accident.

        Spring resolves every field from authoritative state. An agent must treat these as facts
        about the request, not as hints it may reinterpret.
      additionalProperties: false
      required: [domainCode, domainType]
      properties:
        # 64 matches core.learning_domain.code. Deliberately not 96: each identifier carries the
        # width of its own column, rather than the widest column in the schema.
        domainCode:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['KAFKA']
        domainType:
          $ref: '#/components/schemas/DomainType'
        # 64 matches core.curriculum_version.version_code.
        curriculumVersion:
          type: string
          maxLength: 64
          examples: ['v1']

    DomainType:
      type: string
      description: >
        Generic classification of a learning domain. Mirrors core.learning_domain.domain_type;
        adding a value is a curriculum governance decision, not an application concern.
      enum: [TECHNOLOGY, ACADEMIC, PROFESSIONAL]

    LearningGoalContext:
      type: object
      description: >
        What the learner is working towards, when that is known and relevant to the request.

        Optional throughout, because the authoritative learner model carries a single goal today and
        richer goal structures are an MVP-5 concern. The shape exists now so that agents are written
        against a general goal rather than against "the learner's one domain", which is the
        assumption that would be expensive to unpick later.
      additionalProperties: false
      required: [goalType, goalCode]
      properties:
        goalType:
          $ref: '#/components/schemas/GoalType'
        # 96: a goal code may reference a skill-scale identifier.
        goalCode:
          type: string
          minLength: 1
          maxLength: 96
          examples: ['KAFKA']
        targetDate:
          type: string
          format: date
        goalVersion:
          type: string
          maxLength: 64

    GoalType:
      type: string
      description: >
        Kind of goal the learner is pursuing. Only LEARNING_DOMAIN is produced today; the remaining
        values are declared so that adding one later is not a breaking contract change. An agent
        must not infer that a value is supported merely because it can be named here.
      enum:
        - LEARNING_DOMAIN
        - ACADEMIC_MASTERY
        - DEGREE_COMPETENCY
        - CAREER_ROLE
        - CAREER_TRANSITION

    DecimalString:
      type: string
      pattern: '^\d\.\d{4}$'
      description: >
        Fixed-scale decimal carried as a string. The deterministic engines use BigDecimal at a
        canonical scale; a JSON number would invite a float round-trip and break reproducibility.
      examples: ['0.7200']

    Constraints:
      type: object
      additionalProperties: false
      required: [interactionClass, deadlineMs]
      properties:
        interactionClass:
          $ref: '#/components/schemas/InteractionClass'
        deadlineMs:
          type: integer
          minimum: 1
          maximum: 15000
          description: >
            Remaining budget when the call was made, not a per-hop timeout. The callee must not
            exceed it and must not begin work it cannot finish within it (M1-ADR-001).
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 4000
        allowedTools:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
          description: Capability allowlist. An empty array means no tools.
        policyVersion:
          type: string
          maxLength: 64

    AIRequestEnvelope:
      type: object
      additionalProperties: false
      required: [contractVersion, interactionId, requestId, learner, constraints]
      properties:
        contractVersion: { $ref: '#/components/schemas/ContractVersion' }
        interactionId:
          type: string
          maxLength: 64
          description: Logical learner action. Stable across safe retries.
        requestId:
          type: string
          maxLength: 64
          description: One transport attempt. New per retry.
        learner: { $ref: '#/components/schemas/LearnerRef' }
        learningContext: { $ref: '#/components/schemas/LearningContext' }
        # Optional rather than required: making a new property required would reject payloads a peer
        # already sends, which the compatibility gate correctly refuses. Spring populates
        # domainContext on every request it builds; the optionality is a contract-evolution
        # concession, not permission for a caller to omit it.
        domainContext: { $ref: '#/components/schemas/DomainContext' }
        learningGoalContext: { $ref: '#/components/schemas/LearningGoalContext' }
        constraints: { $ref: '#/components/schemas/Constraints' }
        requestedCapability:
          type: string
          maxLength: 64

    Usage:
      type: object
      description: >-
        Usage accumulated from the governed model calls in one AI proposal. latencyMs is the sum
        of model-call durations, including bounded repair calls and gateway retry/fallback handling;
        it is not full HTTP request or learner-interaction end-to-end latency.
      additionalProperties: false
      properties:
        inputTokens: { type: integer, minimum: 0 }
        cachedInputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: string, pattern: '^\d+\.\d{1,6}$' }
        latencyMs: { type: integer, minimum: 0 }

    Validation:
      type: object
      description: What the AI plane checked before returning. Spring re-validates regardless.
      additionalProperties: false
      required: [schemaValid]
      properties:
        schemaValid: { type: boolean }
        semanticValid: { type: boolean }
        repairAttempts: { type: integer, minimum: 0, maximum: 2 }

    AIProposalEnvelope:
      type: object
      additionalProperties: false
      required:
        [contractVersion, proposalId, agentType, agentVersion, modelRoute, trustLevel, proposal]
      properties:
        contractVersion: { $ref: '#/components/schemas/ContractVersion' }
        proposalId:
          type: string
          maxLength: 64
          description: Identity of this proposal. Referenced by DecisionRecord when it influences one.
        agentType: { $ref: '#/components/schemas/AgentType' }
        agentVersion: { type: string, maxLength: 64 }
        agentRunId:
          type: string
          maxLength: 64
          description: >
            The orchestrated agent execution that produced this proposal (Observability HLD §9).
            Distinct from proposalId, requestId and interactionId: a retried request produces
            several runs, and one interaction may involve several agents. Carried on the wire so
            the deterministic core's log lines for a decision can name the run that proposed it --
            otherwise the correlation chain ends at the plane boundary, which is where a support
            pivot most often needs to cross. Optional, so a plane that predates the field still
            validates.
        promptTemplateId:
          type: string
          maxLength: 64
          description: >
            Which prompt produced this proposal (M1-ADR-011). Two of the assessment agent's prompts
            share a version, so promptVersion alone does not identify one.
        promptVersion: { type: string, maxLength: 64 }
        modelRoute: { type: string, maxLength: 64 }
        trustLevel: { $ref: '#/components/schemas/TrustLevel' }
        confidence:
          $ref: '#/components/schemas/DecimalString'
          description: >
            The agent's self-reported confidence. Never a basis for authority: Spring's deterministic
            policy decides, and a high value here changes nothing.
        reasonCodes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 64 }
        proposal:
          type: object
          description: >
            Agent-specific payload. Deliberately open at v1.0 so each agent can define its own shape
            in its own task without a breaking contract change; each agent's schema is pinned by its
            own golden fixtures.
          additionalProperties: true
        validation: { $ref: '#/components/schemas/Validation' }
        usage: { $ref: '#/components/schemas/Usage' }

    Capabilities:
      type: object
      additionalProperties: false
      required: [contractVersion, service, version, environment, aiEnabled, modelRoute, agents, authority]
      properties:
        contractVersion: { $ref: '#/components/schemas/ContractVersion' }
        service: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 32 }
        environment: { type: string, maxLength: 32 }
        aiEnabled: { type: boolean }
        modelRoute: { type: string, maxLength: 64 }
        routeTableVersion:
          type: string
          maxLength: 256
          description: >
            The route configuration this process is actually serving. Equal to the shipped table
            version when nothing is pinned, and extended with the pins when a prompt or model has
            been rolled back (M1-ADR-008, M1-ADR-011). Reported so a rollback that did not take
            effect is distinguishable from one that did: without it, the two look identical from
            outside the process. Optional, so a deployment that predates the field still validates.
        agents:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AgentType' }
        authority:
          type: string
          enum: [NON_AUTHORITATIVE]
          description: Stated on the wire so no caller can mistake this service for a decision-maker.

    Problem:
      type: object
      description: >
        RFC 9457 problem document, matching the MVP-0 error contract so one support code works
        across both runtimes.
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, maxLength: 256 }
        title: { type: string, maxLength: 256 }
        status: { type: integer, minimum: 100, maximum: 599 }
        code: { type: string, maxLength: 64 }
        detail: { type: string, maxLength: 1024 }
        interactionId: { type: string, maxLength: 64 }
        traceId: { type: string, maxLength: 64 }
