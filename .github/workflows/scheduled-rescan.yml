# Scheduled re-scan of already-published images. Vulnerability databases evolve, so an image that
# passed its release gate can become vulnerable without any code change. This re-scans the currently
# deployed digests without rebuilding, preserving build-once/promote-the-same-artifact.
name: Scheduled Rescan

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-rescan
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  rescan:
    name: Rescan ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [learning-platform, web-ui]
    steps:
      - name: Check out trusted ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # OCI references must be lowercase; a GitHub owner may contain capitals.
      - name: Resolve desired digest and lowercase image name
        id: desired
        env:
          COMPONENT: ${{ matrix.component }}
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(python3 -c "
          import json, os
          manifest = json.load(open('deploy/desired-version.json'))
          print(manifest['components'][os.environ['COMPONENT']]['digest'])
          ")"
          name="${REGISTRY}/$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')/ramals-${COMPONENT}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Rescanning ${name} at ${digest}"

      - name: Authenticate to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Same rationale as the release pipeline: run the pinned scanner image directly.
      - name: Rescan published image
        env:
          IMAGE: ${{ steps.desired.outputs.name }}@${{ steps.desired.outputs.digest }}
          TRIVY_IMAGE: aquasec/trivy:0.64.1
        run: |
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "${IMAGE}"

      - name: Report rescan outcome
        if: always()
        env:
          COMPONENT: ${{ steps.desired.outputs.name }}
          DIGEST: ${{ steps.desired.outputs.digest }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Rescan: ${COMPONENT}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo "Result: **${RESULT}**"
            echo
            echo "A failure means a newly disclosed CRITICAL/HIGH affects a deployed image."
            echo "Remediate by rebuilding from a patched base and promoting a new digest;"
            echo "do not mutate the existing immutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
