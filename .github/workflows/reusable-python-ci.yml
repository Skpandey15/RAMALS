name: Reusable Python CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ramals-ai
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      # No model key is provided, and none is needed: the service defaults to the deterministic
      # ci-fake route with AI execution disabled. A CI run that required a paid provider would be a
      # gate nobody could reproduce locally.
      - name: Test with coverage
        run: python -m pytest -q --cov --cov-report=term-missing
      - name: Audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          python -m pip_audit --strict --progress-spinner off
