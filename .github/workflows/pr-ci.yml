name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      python: ${{ steps.changes.outputs.python }}
      contract: ${{ steps.changes.outputs.contract }}
      database: ${{ steps.changes.outputs.database }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/detect-changes.sh "$BASE_SHA" "$HEAD_SHA"

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-backend-ci.yml

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-frontend-ci.yml

  python-ci:
    name: Python CI
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    uses: ./.github/workflows/reusable-python-ci.yml

  contract-ci:
    name: Contract CI
    needs: detect-changes
    if: needs.detect-changes.outputs.contract == 'true'
    uses: ./.github/workflows/reusable-contract-ci.yml

  security-ci:
    name: Security CI
    needs: detect-changes
    uses: ./.github/workflows/reusable-security-ci.yml

  # Would these images actually publish?
  #
  # release.yml builds and scans them, but it runs on push to main -- after merge -- so the answer
  # used to arrive only in hindsight. M1-T17 slice 1 connected ramals-ai to the publish matrix with
  # an image that had never been scanned, and eight consecutive merges went red while every pull
  # request showed green. The gate worked; nothing ran it where anybody would look.
  #
  # Gated on infrastructure as well as the component's own paths, so a change to the check or the
  # workflow that calls it exercises itself. A gate whose own change cannot run it is how the first
  # one got shipped broken.
  image-learning-platform:
    name: Image releaseability (learning-platform)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build, scan and smoke the image
        run: bash scripts/ci/check-image-releaseability.sh learning-platform

  image-web-ui:
    name: Image releaseability (web-ui)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build, scan and smoke the image
        run: bash scripts/ci/check-image-releaseability.sh web-ui

  image-ai:
    name: Image releaseability (ramals-ai)
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build, scan and smoke the image
        run: bash scripts/ci/check-image-releaseability.sh ai

  image-keycloak:
    name: Image buildability (keycloak)
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build Keycloak image
        run: docker build --pull=false -f infrastructure/docker/keycloak/Dockerfile -t ramals-keycloak:pr .

  jenkins-cd-validation:
    name: Jenkins/CD validation
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out untrusted PR without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate Jenkins CD boundary
        shell: pwsh
        run: ./scripts/ci/validate-jenkins-cd.ps1

  ci-gate:
    name: ci-gate
    if: always()
    needs: [detect-changes, backend-ci, frontend-ci, python-ci, contract-ci, security-ci,
            image-learning-platform, image-web-ui, image-ai, image-keycloak, jenkins-cd-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required and conditional jobs
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
          PYTHON_RESULT: ${{ needs.python-ci.result }}
          CONTRACT_RESULT: ${{ needs.contract-ci.result }}
          SECURITY_RESULT: ${{ needs.security-ci.result }}
          IMAGE_BACKEND_RESULT: ${{ needs.image-learning-platform.result }}
          IMAGE_WEBUI_RESULT: ${{ needs.image-web-ui.result }}
          IMAGE_AI_RESULT: ${{ needs.image-ai.result }}
          IMAGE_KEYCLOAK_RESULT: ${{ needs.image-keycloak.result }}
          JENKINS_CD_RESULT: ${{ needs.jenkins-cd-validation.result }}
        run: |
          required=("detect-changes:$DETECT_RESULT" "security-ci:$SECURITY_RESULT")
          conditional=("backend-ci:$BACKEND_RESULT" "frontend-ci:$FRONTEND_RESULT" "python-ci:$PYTHON_RESULT" "contract-ci:$CONTRACT_RESULT" "image-learning-platform:$IMAGE_BACKEND_RESULT" "image-web-ui:$IMAGE_WEBUI_RESULT" "image-ai:$IMAGE_AI_RESULT" "image-keycloak:$IMAGE_KEYCLOAK_RESULT" "jenkins-cd-validation:$JENKINS_CD_RESULT")

          for entry in "${required[@]}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name must succeed; result=$result"
              exit 1
            fi
          done

          for entry in "${conditional[@]}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$name failed merge assurance; result=$result"
              exit 1
            fi
          done

          echo "All required checks passed; conditional skips were policy-valid."
