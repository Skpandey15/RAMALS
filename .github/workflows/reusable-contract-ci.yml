name: Reusable Contract CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned tooling
        run: python -m pip install --disable-pip-version-check -e "ramals-ai[dev]"
      - name: Validate the OpenAPI document
        run: |
          python - <<'PYEOF'
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename
          spec, _ = read_from_filename("contracts/ai-internal.openapi.yaml")
          validate(spec)
          print("OpenAPI 3.1 document is valid")
          PYEOF
      # The committed models must match a fresh generation. Without this the contract and the Python
      # side can drift apart while every other check stays green.
      - name: Check generated models are current
        run: python scripts/ci/generate-contract-models.py --check
      # A rolling release runs both contract versions at once, so a change that is fine in one
      # codebase can still break the live boundary.
      - name: Check backward compatibility
        run: python scripts/ci/check-contract-compatibility.py
      - name: Cross-language golden fixtures (Python half)
        run: python -m pytest ramals-ai/tests/contract -q
        env:
          PYTHONPATH: ramals-ai/src
