# RAMALS additions to the inherited keycloak.v2 login messages.
#
# Deliberately namespaced `ramals*` rather than overriding Keycloak's own `noAccount`/`doRegister`.
# Those two belong to Keycloak's native registration block, which stays switched off (M1-ADR-015);
# reusing their keys would make a future reader think native registration is in play.
ramalsNoAccount=New to RAMALS?
ramalsDoRegister=Create a learner account
ramalsBackHome=Back to RAMALS
