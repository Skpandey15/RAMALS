# RAMALS login theme.
#
# Exists for exactly one reason: RAMALS owns learner registration, so `registrationAllowed` is false
# (M1-ADR-015) and the stock template therefore renders no route to an account. An unregistered
# learner who reaches this page has nowhere to go. This theme adds that route -- a link back to the
# RAMALS-owned /register page -- without enabling Keycloak self-registration.
#
# `parent=keycloak.v2` inherits every style, script and template except the one file overridden in
# this directory. Do not copy assets here; inheritance is what keeps the override small.
parent=keycloak.v2
