name: ramals

services:
  postgres:
    build:
      context: ../..
      dockerfile: infrastructure/docker/postgres-init/Dockerfile
    environment:
      POSTGRES_DB: ${RAMALS_DB_NAME:?Set RAMALS_DB_NAME in .env}
      POSTGRES_USER: ${RAMALS_DB_ADMIN_USER:?Set RAMALS_DB_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${RAMALS_DB_ADMIN_PASSWORD:?Set RAMALS_DB_ADMIN_PASSWORD in .env}
      RAMALS_DB_MIGRATION_PASSWORD: ${RAMALS_DB_MIGRATION_PASSWORD:?Set RAMALS_DB_MIGRATION_PASSWORD in .env}
      RAMALS_DB_RUNTIME_PASSWORD: ${RAMALS_DB_RUNTIME_PASSWORD:?Set RAMALS_DB_RUNTIME_PASSWORD in .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  keycloak:
    build:
      context: ../..
      dockerfile: infrastructure/docker/keycloak/Dockerfile
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in .env}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${RAMALS_KEYCLOAK_ADMIN:?Set RAMALS_KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RAMALS_KEYCLOAK_ADMIN_PASSWORD:?Set RAMALS_KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - data
      - edge
    ports:
      - "127.0.0.1:${RAMALS_KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27.11
    networks:
      - data
      - edge
    ports:
      - "127.0.0.1:${RAMALS_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ../..
      dockerfile: learning-platform/Dockerfile
    environment:
      RAMALS_DB_URL: jdbc:postgresql://postgres:5432/${RAMALS_DB_NAME:?Set RAMALS_DB_NAME in .env}
      RAMALS_DB_USER: ${RAMALS_DB_RUNTIME_USER:-ramals_core_runtime}
      RAMALS_DB_PASSWORD: ${RAMALS_DB_RUNTIME_PASSWORD:?Set RAMALS_DB_RUNTIME_PASSWORD in .env}
      RAMALS_DB_MIGRATION_USER: ${RAMALS_DB_MIGRATION_USER:-ramals_core_migration}
      RAMALS_DB_MIGRATION_PASSWORD: ${RAMALS_DB_MIGRATION_PASSWORD:?Set RAMALS_DB_MIGRATION_PASSWORD in .env}
      RAMALS_OIDC_ISSUER_URI: ${RAMALS_OIDC_ISSUER_URI:-http://keycloak:8080/realms/ramals}
      RAMALS_OIDC_AUDIENCE: ${RAMALS_OIDC_AUDIENCE:-ramals-api}
      RAMALS_WEB_ORIGIN: ${RAMALS_WEB_ORIGIN:-http://localhost:5173}
      RAMALS_REGISTRATION_ENABLED: ${RAMALS_REGISTRATION_ENABLED:-false}
      RAMALS_ENVIRONMENT: ${RAMALS_ENVIRONMENT:-dev}
      RAMALS_KEYCLOAK_ADMIN_BASE_URL: ${RAMALS_KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      RAMALS_REGISTRATION_ADMIN_CLIENT_ID: ${RAMALS_REGISTRATION_ADMIN_CLIENT_ID:-ramals-registration-admin}
      RAMALS_REGISTRATION_ADMIN_CLIENT_SECRET: ${RAMALS_REGISTRATION_ADMIN_CLIENT_SECRET:-}
      RAMALS_OTP_HMAC_KEY_VERSION: ${RAMALS_OTP_HMAC_KEY_VERSION:-v1}
      RAMALS_OTP_HMAC_KEYS: ${RAMALS_OTP_HMAC_KEYS:-}
      RAMALS_SMS_PROVIDER: ${RAMALS_SMS_PROVIDER:-fake}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - data
      - edge
    ports:
      - "127.0.0.1:${RAMALS_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web-ui:
    build:
      context: ../..
      dockerfile: web-ui/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    ports:
      - "127.0.0.1:${RAMALS_WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true

networks:
  data:
    internal: true
  edge:

volumes:
  postgres-data:
