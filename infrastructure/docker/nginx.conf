server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Content-addressed build output. Two rules, and both matter.
  #
  # `=404` rather than the SPA fallback: a missing asset must fail as a missing asset. Falling back
  # to index.html answers a JavaScript module request with `200 text/html`, the browser cannot parse
  # HTML as a module, React never mounts, and the learner gets a blank page with nothing to go on.
  # A 404 says what actually happened.
  #
  # `immutable` is safe precisely because the filename carries the content hash: a changed bundle is
  # a different URL, so it can never be served stale.
  #
  # nginx does not inherit add_header into a location that declares its own, so the three security
  # headers are repeated here rather than silently dropped.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The entry document must never be held across a deployment. It is the one file whose URL does not
  # change when its contents do, so a cached copy keeps pointing at asset hashes the new image no
  # longer contains -- which is exactly the blank page above, arriving hours after the deploy that
  # caused it. Previously no Cache-Control was set at all, leaving browsers to apply heuristic
  # caching to precisely the file that must not be cached.
  #
  # `no-cache` rather than `no-store`: revalidation is required, but an unchanged document may still
  # be answered with a 304 against the ETag.
  location / {
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
